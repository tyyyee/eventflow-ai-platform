server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8093}
  shutdown: graceful
  tomcat:
    threads:
      max: 48
    max-connections: 128
    accept-count: 64
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${DATABASE_URL:${UPGRADE_DB_URL:jdbc:mysql://127.0.0.1:23307/life_choice?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&socketTimeout=5000}}
    username: ${DATABASE_USERNAME:life_choice}
    password: ${DATABASE_PASSWORD:${UPGRADE_DB_PASSWORD:}}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 2000
  jdbc:
    template:
      query-timeout: 3s
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:26380}
      password: ${REDIS_PASSWORD:${UPGRADE_REDIS_PASSWORD:}}
      timeout: 300ms
      connect-timeout: 300ms
upgrade:
  local-life:
    enabled: ${LOCAL_LIFE_ENABLED:false}
    demo-data: ${LOCAL_LIFE_DEMO:false}
    media-directory: ${LOCAL_LIFE_MEDIA:.local/local-life-media}
  rocketmq:
    nameserver: ${ROCKETMQ_NAMESERVER:127.0.0.1:39876}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:qupiao-producer}
    create-topics: ${ROCKETMQ_CREATE_TOPICS:true}
  group: ${UPGRADE_GROUP:qupiao-orders-v2}
  close-topic: ${CLOSE_TOPIC:qupiao-close-v2}
  close-group: ${CLOSE_GROUP:qupiao-close-v2}
  close-fallback-ms: ${CLOSE_FALLBACK_MS:60000}
  core32:
    enabled: ${CORE32_ENABLED:false}
    urls: ${CORE32_URLS:jdbc:mysql://127.0.0.1:33400/qupiao_core32,jdbc:mysql://127.0.0.1:33401/qupiao_core32,jdbc:mysql://127.0.0.1:33402/qupiao_core32,jdbc:mysql://127.0.0.1:33403/qupiao_core32}
    username: ${CORE32_DB_USER:qupiao}
    password: ${CORE32_DB_PASSWORD:}
    topic: ${CORE32_TOPIC:qupiao-core32-orders}
    group: ${CORE32_GROUP:qupiao-core32-orders-v2}
    close-topic: ${CORE32_CLOSE_TOPIC:qupiao-core32-close-v2}
    close-group: ${CORE32_CLOSE_GROUP:qupiao-core32-close-v2}
  history:
    replica-enabled: ${HISTORY_REPLICA_ENABLED:false}
    urls: ${HISTORY_URLS:jdbc:mysql://127.0.0.1:33317/qupiao_history,jdbc:mysql://127.0.0.1:33318/qupiao_history}
    username: ${HISTORY_DB_USER:qupiao}
    password: ${HISTORY_DB_PASSWORD:}
  auth-secret: ${APP_AUTH_SECRET:${UPGRADE_AUTH_SECRET:}}
  metrics-token: ${METRICS_TOKEN:}
  sandbox-payments: ${SANDBOX_PAYMENTS:false}
  topic: ${UPGRADE_TOPIC:upgrade-orders-v1}
  jobs: true
  compact-transactions: true
  reconcile-page-size: 32
  reconcile-budget: 100
  relay-batch: 100
  relay-window: 1
  relay-delay-ms: 100
  repair-batch: 100
  repair-delay-ms: 1000
  rate-user: 5
  rate-activity: 200
  backlog-limit: 5000
  oldest-seconds: 60
  cache-soft-ms: 5000
  cache-hard-ms: 15000
  cookie-secure: ${COOKIE_SECURE:false}
  planning:
    mode: ${PLANNING_MODE:disabled}
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout: 20s
  assistant:
    mode: ${ASSISTANT_MODE:stub}
    jobs: ${ASSISTANT_JOBS:true}
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${ASSISTANT_MODEL:deepseek-flash}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: life-choice-backend
